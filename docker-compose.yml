# Mint: everything on one machine.
#
#   docker compose up -d                  then open https://$MINT_DOMAIN
#   docker compose run --rm init          shows the admin login again
#
# Set MINT_DOMAIN to your HTTPS hostname. Secrets, the database password and the admin login are generated
# on first boot by the `init` service and kept in the `secrets` volume. See .env.example for options.
#
# Services
#   caddy     the only public entry point: the site, /ws (realtime) and /ingest (hub). HTTPS when MINT_DOMAIN is set.
#   web       Next.js site, dashboard and the volunteer-worker API
#   realtime  WebSocket gateway (Redis pub/sub -> browsers)
#   hub       volunteer uploads in. No Plex/Lidarr/TorBox access.
#   worker    the pipeline: sync, Lidarr/TorBox, Cobalt, tagging, Plex, sonic analysis. Wires up Plex and Lidarr itself.
#   postgres, redis                                               (data network, no published ports)
#   lidarr, prowlarr, cobalt, plex                                (media network: the barrier)
#
# Website on Vercel instead? Add docker-compose.vercel.yml (see the README).

name: mint

x-app: &app
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment:
    MINT_DOMAIN: ${MINT_DOMAIN:-mint.example.com}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

x-mint-image: &mint-worker-image ghcr.io/${GHCR_OWNER:-chickenbone}/mint-worker:${MINT_TAG:-latest}

# The optional .env is shared for database/session configuration, not media credentials.
x-public-env: &public-env
  MINT_DOMAIN: ${MINT_DOMAIN:-mint.example.com}
  TORBOX_API_KEY: ""
  PLEX_TOKEN: ""
  PLEX_CLAIM: ""
  LIDARR_API_KEY: ""
  PROWLARR_API_KEY: ""
  USENET_INDEXER_API_KEY: ""
  ANALYSIS_WORKER_TOKEN: ""
  SPOTIFY_CLIENT_ID: ""
  SPOTIFY_CLIENT_SECRET: ""
  SPOTIFY_API_MODE: ""
  MUSICBRAINZ_MIRROR_URL: ""

services:
  init:
    <<: *app
    image: *mint-worker-image
    restart: "no"
    user: "0:0"
    entrypoint: ["node", "init.mjs"]
    command: []
    environment:
      MINT_DOMAIN: ${MINT_DOMAIN:-mint.example.com}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - secrets:/secrets
      - ${MUSIC_PATH:-./data/music}:/music
      - ${BLACKHOLE_PATH:-./data/blackhole}:/blackhole
    network_mode: none

  caddy:
    <<: *app
    image: caddy:2
    env_file: []
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      realtime: { condition: service_healthy }
      hub: { condition: service_healthy }
      web: { condition: service_healthy, required: false }

  web:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:-chickenbone}/mint-web:${MINT_TAG:-latest}
    environment:
      <<: *public-env
      PLAYBACK_WORKER_URL: http://worker:8080
      NATIVE_WEB_ORIGINS: ${NATIVE_WEB_ORIGINS:-}
      MINT_CHARTS_ENABLED: ${MINT_CHARTS_ENABLED:-true}
      MINT_CHART_SOURCE_URL: ${MINT_CHART_SOURCE_URL:-}
      YOUTUBE_SCRAPE_AUTHORIZED: ${YOUTUBE_SCRAPE_AUTHORIZED:-false}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      SPOTIFY_API_MODE: ${SPOTIFY_API_MODE:-development}
    volumes: [secrets:/secrets:ro]
    networks: [edge, data]
    depends_on: &needs-data
      init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy, required: false }
      redis: { condition: service_healthy, required: false }

  # Opt-in metadata-only API. No secrets volume, shared env-file or media access.
  chart-source:
    profiles: [chart-source]
    image: ghcr.io/${GHCR_OWNER:-chickenbone}/mint-chart-source:${MINT_TAG:-latest}
    restart: unless-stopped
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      PORT: "3090"
      MINT_CHARTS_ENABLED: ${MINT_CHARTS_ENABLED:-true}
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [data]
    depends_on:
      redis: { condition: service_healthy, required: false }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  realtime:
    <<: *app
    image: ghcr.io/${GHCR_OWNER:-chickenbone}/mint-realtime:${MINT_TAG:-latest}
    environment: *public-env
    volumes: [secrets:/secrets:ro]
    networks: [edge, data]
    depends_on: *needs-data

  hub:
    <<: *app
    image: *mint-worker-image
    command: ["node", "--enable-source-maps", "dist/hub.js"]
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      <<: *public-env
      MINT_DOMAIN: ${MINT_DOMAIN:-mint.example.com}
      STAGING_DIR: /data/staging
      HUB_PORT: "8090"
    volumes:
      - secrets:/secrets:ro
      - staging:/data/staging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, data]
    depends_on:
      worker: { condition: service_started }

  worker:
    <<: *app
    image: *mint-worker-image
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      MINT_DOMAIN: ${MINT_DOMAIN:-mint.example.com}
      YOUTUBE_SCRAPE_AUTHORIZED: ${YOUTUBE_SCRAPE_AUTHORIZED:-false}
      MUSIC_DIR: /music
      STAGING_DIR: /data/staging
      BLACKHOLE_TORRENT_DIR: /blackhole/torrents
      BLACKHOLE_NZB_DIR: /blackhole/nzbs
      BLACKHOLE_DOWNLOAD_DIR: /blackhole/downloads
      BLACKHOLE_NZB_DOWNLOAD_DIR: /blackhole/usenet-downloads
      LIDARR_URL: http://lidarr:8686
      LIDARR_CONFIG_DIR: /lidarr-config
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_CONFIG_DIR: /prowlarr-config
      COBALT_URL: ${LOCAL_COBALT_URL-http://cobalt:9000}
      PLEX_URL: http://plex:32400
      PLEX_CONFIG_DIR: /plex-config
      # Optional independently operated MusicBrainz stack; blank uses the public API.
      MUSICBRAINZ_MIRROR_URL: ${MUSICBRAINZ_MIRROR_URL:-}
    volumes:
      - secrets:/secrets:ro
      - ${MUSIC_PATH:-./data/music}:/music
      - ${BLACKHOLE_PATH:-./data/blackhole}:/blackhole
      - staging:/data/staging
      # Read-only, so the worker can pick up the Plex token and Lidarr API key by itself.
      - plex_config:/plex-config:ro
      - lidarr_config:/lidarr-config:ro
      - prowlarr_config:/prowlarr-config:ro
    networks: [data, media]
    depends_on: *needs-data

  postgres:
    <<: *app
    image: postgres:17-alpine
    env_file: []
    environment:
      POSTGRES_USER: mint
      POSTGRES_DB: mint
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
      - secrets:/secrets:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d mint"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init: { condition: service_completed_successfully }

  redis:
    <<: *app
    image: redis:7-alpine
    env_file: []
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- media tier (behind the barrier) ----------

  lidarr:
    <<: *app
    image: lscr.io/linuxserver/lidarr:latest
    env_file: []
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - lidarr_config:/config
      - ${MUSIC_PATH:-./data/music}:/music
      - ${BLACKHOLE_PATH:-./data/blackhole}:/blackhole
    # Loopback only; from another machine: ssh -L 8686:127.0.0.1:8686 host
    ports: ["127.0.0.1:8686:8686"]
    networks: [media]
    depends_on:
      init: { condition: service_completed_successfully }

  cobalt:
    <<: *app
    # Stock 11 can resolve metadata but deliver empty audio. See docs/self-hosting.md#cobalt.
    image: ${COBALT_IMAGE:-ghcr.io/imputnet/cobalt:11}
    env_file: []
    init: true
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
      # VISIONOS requires the pinned opt-in build documented in the Cobalt guide.
      CUSTOM_INNERTUBE_CLIENT: ${COBALT_INNERTUBE_CLIENT:-IOS}
      # Optional: YouTube cookies if rips start failing with "login required".
      # COOKIE_PATH: /cookies.json
    # volumes: [./cobalt-cookies.json:/cookies.json:ro]
    networks: [media]

  prowlarr:
    <<: *app
    image: lscr.io/linuxserver/prowlarr:latest
    env_file: []
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
    volumes: [prowlarr_config:/config]
    ports: ["127.0.0.1:9696:9696"]
    networks: [media]
    depends_on:
      init: { condition: service_completed_successfully }

  plex:
    <<: *app
    image: lscr.io/linuxserver/plex:latest
    env_file: []
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Etc/UTC}
      VERSION: docker
      # From https://plex.tv/claim, valid for 4 minutes. Only needed on the very first start.
      PLEX_CLAIM: ${PLEX_CLAIM:-}
    volumes:
      - plex_config:/config
      - ${MUSIC_PATH:-./data/music}:/music:ro
    # Plexamp connects here directly (Plex Settings -> Remote Access, manual port 32400).
    ports: ["32400:32400"]
    networks: [media]
    depends_on:
      init: { condition: service_completed_successfully }

configs:
  caddyfile:
    content: |
      {
      	admin off
      }
      ${MINT_DOMAIN:-mint.example.com} {
      	encode zstd gzip

      	handle /ws* {
      		reverse_proxy realtime:3001 {
      			header_up X-Forwarded-For {remote_host}
      		}
      	}

      	@ingest path /ingest/*
      	handle @ingest {
      		request_body {
      			max_size 250MB
      		}
      		reverse_proxy hub:8090 {
      			header_up X-Forwarded-For {remote_host}
      			transport http {
      				read_timeout 1h
      				write_timeout 1h
      			}
      		}
      	}

      	handle {
      		reverse_proxy web:3000 {
      			# Trust only Caddy's view of the client address.
      			header_up X-Forwarded-For {remote_host}
      			header_up X-Real-IP {remote_host}
      		}
      	}

      	log {
      		output stdout
      		format console
      	}
      }

networks:
  edge: {}
  # Not internal: the worker needs egress (YouTube, MusicBrainz, TorBox). Postgres/Redis publish no ports.
  data: {}
  media: {}

volumes:
  secrets: {}
  caddy_data: {}
  caddy_config: {}
  postgres: {}
  redis: {}
  staging: {}
  lidarr_config: {}
  prowlarr_config: {}
  plex_config: {}
