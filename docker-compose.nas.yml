# Paste this whole file into your NAS Docker / Compose project editor.
# Edit ONLY this settings block, then deploy. No .env, shell, build or extra files.
# Cloudflare Tunnel provides public HTTPS. No router forwarding or public Caddy ports.
# Do not publish your filled-in copy: it contains your personal integration keys.
x-settings:
  MINT_DOMAIN: &domain "mint.example.com"
  # Required: connector token from a remotely managed Cloudflare Tunnel.
  # Route MINT_DOMAIN to http://caddy:80 in the Cloudflare dashboard.
  # This is a tunnel token (eyJ...), NOT a Cloudflare API token.
  TUNNEL_TOKEN: &tunnel-token ""
  ADMIN_EMAIL: &admin-email "admin@mint.local"
  # Pull images FIRST, then get a fresh https://plex.tv/claim token and recreate Plex.
  # Claims expire in 4 minutes; leave blank when using an existing Plex server.
  PLEX_CLAIM: &plex-claim ""
  # Bypass a broken NAS/router DNS forwarder for Plex's plex.tv claim request.
  # Use your reachable DNS servers if public DNS is blocked; [] restores Docker defaults.
  PLEX_DNS: &plex-dns ["1.1.1.1", "8.8.8.8"]
  # Optional until you want to link YouTube Music; see README -> Google.
  GOOGLE_CLIENT_ID: &google-id ""
  GOOGLE_CLIENT_SECRET: &google-secret ""
  # Optional read-only Spotify playlist sync. Register the public callback; see docs/spotify.md.
  SPOTIFY_CLIENT_ID: &spotify-id ""
  SPOTIFY_CLIENT_SECRET: &spotify-secret ""
  SPOTIFY_API_MODE: &spotify-mode "development"
  # Optional: without TorBox, Mint uses Cobalt for every download.
  TORBOX_API_KEY: &torbox-key ""
  # Mint-owned folders: relative to the UGOS Compose Project storage path.
  SECRETS_FOLDER: &secrets-folder "./data/secrets"
  MUSIC_FOLDER: &music-folder "./data/music"
  BLACKHOLE_FOLDER: &blackhole-folder "./data/blackhole"
  STAGING_FOLDER: &staging-folder "./data/staging"
  POSTGRES_FOLDER: &postgres-folder "./data/postgres"
  REDIS_FOLDER: &redis-folder "./data/redis"
  CADDY_DATA_FOLDER: &caddy-data-folder "./data/caddy"
  CADDY_CONFIG_FOLDER: &caddy-config-folder "./data/caddy-config"
  PLEX_CONFIG_FOLDER: &plex-config-folder "./data/plex"
  LIDARR_CONFIG_FOLDER: &lidarr-config-folder "./data/lidarr"
  PROWLARR_CONFIG_FOLDER: &prowlarr-config-folder "./data/prowlarr"
  AUTO_CONFIGURE_INDEXERS: &auto-indexers "true"
  PROWLARR_PUBLIC_INDEXERS: &public-indexers "internetarchive,thepiratebay,limetorrents,1337x"
  # Optional Newznab indexer account; separate from TorBox's Usenet provider access.
  USENET_INDEXER_URL: &usenet-indexer-url ""
  USENET_INDEXER_API_KEY: &usenet-indexer-key ""
  # Optional existing Plex. Replace URL, token, section ID and folder mapping together.
  PLEX_URL: &plex-url "http://plex:32400"
  PLEX_TOKEN: &plex-token ""
  PLEX_MUSIC_SECTION_ID: &plex-section ""
  PLEX_READ_ONLY: &plex-read-only "false"
  INDEX_EXISTING_LIBRARY: &index-existing "false"
  # NAS absolute path selected in File Manager; never point this at Mint's download folder.
  EXISTING_MUSIC_FOLDER: &existing-music-folder "./existing-library"
  # Same existing music directory as the external Plex server sees it.
  EXISTING_PLEX_MUSIC_DIR: &existing-plex-dir "/music"
  # Optional analysis offload: a distinct random secret, never a Plex or volunteer-worker token.
  ANALYSIS_WORKER_TOKEN: &analysis-worker-token ""
  # Set true only after a separately hosted Mint analysis worker can reach the private gateway.
  ANALYSIS_REMOTE_ONLY: &analysis-remote-only "false"

x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-data: &needs-data
  init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  cloudflared:
    <<: *app
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: *tunnel-token
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [edge]
    depends_on:
      caddy:
        condition: service_started

  init:
    <<: *app
    image: ghcr.io/chickenbone/mint-worker:latest
    restart: "no"
    user: "0:0"
    entrypoint: ["node", "init.mjs"]
    command: []
    environment:
      MINT_DOMAIN: *domain
      ADMIN_EMAIL: *admin-email
    network_mode: none
    volumes:
      - type: bind
        source: *secrets-folder
        target: /secrets
      - type: bind
        source: *music-folder
        target: /music
      - type: bind
        source: *blackhole-folder
        target: /blackhole
      - type: bind
        source: *staging-folder
        target: /data/staging

  caddy:
    <<: *app
    image: caddy:2
    environment:
      MINT_DOMAIN: *domain
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'CADDY'
        {
          admin off
        }
        :80 {
          encode zstd gzip
          handle /ws* {
            reverse_proxy realtime:3001 {
              header_up X-Forwarded-For {remote_host}
            }
          }
          handle /ingest/* {
            request_body {
              max_size 250MB
            }
            reverse_proxy hub:8090 {
              header_up X-Forwarded-For {remote_host}
              transport http {
                read_timeout 1h
                write_timeout 1h
              }
            }
          }
          handle {
            reverse_proxy web:3000 {
              header_up Host {$$MINT_DOMAIN}
              header_up X-Forwarded-Host {$$MINT_DOMAIN}
              header_up X-Forwarded-For {remote_host}
              header_up X-Real-IP {remote_host}
            }
          }
        }
        CADDY
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - type: bind
        source: *caddy-data-folder
        target: /data
      - type: bind
        source: *caddy-config-folder
        target: /config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
      hub:
        condition: service_healthy

  web:
    <<: *app
    image: ghcr.io/chickenbone/mint-web:latest
    environment:
      MINT_DOMAIN: *domain
      PLAYBACK_WORKER_URL: http://worker:8080
      GOOGLE_CLIENT_ID: *google-id
      GOOGLE_CLIENT_SECRET: *google-secret
      SPOTIFY_CLIENT_ID: *spotify-id
      SPOTIFY_CLIENT_SECRET: *spotify-secret
      SPOTIFY_API_MODE: *spotify-mode
    volumes:
      - type: bind
        source: *secrets-folder
        target: /secrets
        read_only: true
    networks: [edge, data]
    depends_on: *needs-data

  realtime:
    <<: *app
    image: ghcr.io/chickenbone/mint-realtime:latest
    environment:
      MINT_DOMAIN: *domain
    volumes:
      - type: bind
        source: *secrets-folder
        target: /secrets
        read_only: true
    networks: [edge, data]
    depends_on: *needs-data

  hub:
    <<: *app
    image: ghcr.io/chickenbone/mint-worker:latest
    command: ["node", "--enable-source-maps", "dist/hub.js"]
    environment:
      MINT_DOMAIN: *domain
      HUB_PORT: "8090"
      STAGING_DIR: /data/staging
    volumes:
      - type: bind
        source: *secrets-folder
        target: /secrets
        read_only: true
      - type: bind
        source: *staging-folder
        target: /data/staging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, data]
    depends_on:
      worker:
        condition: service_started

  worker:
    <<: *app
    image: ghcr.io/chickenbone/mint-worker:latest
    environment:
      MINT_DOMAIN: *domain
      ADMIN_EMAIL: *admin-email
      GOOGLE_CLIENT_ID: *google-id
      GOOGLE_CLIENT_SECRET: *google-secret
      SPOTIFY_CLIENT_ID: *spotify-id
      SPOTIFY_CLIENT_SECRET: *spotify-secret
      SPOTIFY_API_MODE: *spotify-mode
      TORBOX_API_KEY: *torbox-key
      REMOTE_DOWNLOADS: "never"
      ANALYSIS_WORKER_TOKEN: *analysis-worker-token
      ANALYSIS_REMOTE_ONLY: *analysis-remote-only
      MUSIC_DIR: /music
      STAGING_DIR: /data/staging
      BLACKHOLE_TORRENT_DIR: /blackhole/torrents
      BLACKHOLE_NZB_DIR: /blackhole/nzbs
      BLACKHOLE_DOWNLOAD_DIR: /blackhole/downloads
      BLACKHOLE_NZB_DOWNLOAD_DIR: /blackhole/usenet-downloads
      LIDARR_URL: http://lidarr:8686
      LIDARR_CONFIG_DIR: /lidarr-config
      PROWLARR_URL: http://prowlarr:9696
      PROWLARR_CONFIG_DIR: /prowlarr-config
      AUTO_CONFIGURE_INDEXERS: *auto-indexers
      PROWLARR_PUBLIC_INDEXERS: *public-indexers
      USENET_INDEXER_URL: *usenet-indexer-url
      USENET_INDEXER_API_KEY: *usenet-indexer-key
      COBALT_URL: http://cobalt:9000
      PLEX_URL: *plex-url
      PLEX_TOKEN: *plex-token
      PLEX_MUSIC_SECTION_ID: *plex-section
      PLEX_READ_ONLY: *plex-read-only
      INDEX_EXISTING_LIBRARY: *index-existing
      EXISTING_MUSIC_DIR: /existing-music
      EXISTING_PLEX_MUSIC_DIR: *existing-plex-dir
      PLEX_CONFIG_DIR: /plex-config
    volumes:
      - type: bind
        source: *secrets-folder
        target: /secrets
        read_only: true
      - type: bind
        source: *music-folder
        target: /music
      - type: bind
        source: *blackhole-folder
        target: /blackhole
      - type: bind
        source: *staging-folder
        target: /data/staging
      - type: bind
        source: *plex-config-folder
        target: /plex-config
        read_only: true
      - type: bind
        source: *lidarr-config-folder
        target: /lidarr-config
        read_only: true
      - type: bind
        source: *existing-music-folder
        target: /existing-music
        read_only: true
      - type: bind
        source: *prowlarr-config-folder
        target: /prowlarr-config
        read_only: true
    networks: [data, media]
    depends_on: *needs-data

  postgres:
    <<: *app
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mint
      POSTGRES_DB: mint
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - type: bind
        source: *postgres-folder
        target: /var/lib/postgresql/data
      - type: bind
        source: *secrets-folder
        target: /secrets
        read_only: true
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d mint"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init:
        condition: service_completed_successfully

  redis:
    <<: *app
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - type: bind
        source: *redis-folder
        target: /data
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  lidarr:
    <<: *app
    image: lscr.io/linuxserver/lidarr:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - type: bind
        source: *lidarr-config-folder
        target: /config
      - type: bind
        source: *music-folder
        target: /music
      - type: bind
        source: *blackhole-folder
        target: /blackhole
    # Not exposed to the internet. See README for adding indexers from a NAS.
    ports: ["127.0.0.1:8686:8686"]
    networks: [media]
    depends_on:
      init:
        condition: service_completed_successfully

  cobalt:
    <<: *app
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
    networks: [media]

  prowlarr:
    <<: *app
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - type: bind
        source: *prowlarr-config-folder
        target: /config
    ports: ["127.0.0.1:9696:9696"]
    networks: [media]
    depends_on:
      init:
        condition: service_completed_successfully

  plex:
    <<: *app
    image: lscr.io/linuxserver/plex:latest
    dns: *plex-dns
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      VERSION: docker
      PLEX_CLAIM: *plex-claim
    volumes:
      - type: bind
        source: *plex-config-folder
        target: /config
      - type: bind
        source: *music-folder
        target: /music
        read_only: true
    # Avoid colliding with an existing Plex installation on the NAS.
    ports: ["32401:32400"]
    networks: [media]
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  edge: {}
  data: {}
  media: {}
