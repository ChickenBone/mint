# Paste this whole file into your NAS Docker / Compose project editor.
# Edit ONLY this settings block, then deploy. No .env, shell, build or extra files.
# Direct HTTPS needs ports 80/443 forwarded. With Cloudflare Tunnel, set CADDY_SCHEME to http.
# Do not publish your filled-in copy: it contains your personal integration keys.
x-settings:
  MINT_DOMAIN: &domain "mint.example.com"
  # https: Caddy obtains certificates. http: Cloudflare Tunnel handles public HTTPS.
  # Keep MINT_DOMAIN as the public hostname, not the NAS IP, in either mode.
  CADDY_SCHEME: &caddy-scheme "https"
  ADMIN_EMAIL: &admin-email "admin@mint.local"
  # From https://plex.tv/claim just before deploying; expires in 4 minutes.
  PLEX_CLAIM: &plex-claim ""
  # Optional until you want to link YouTube Music; see README -> Google.
  GOOGLE_CLIENT_ID: &google-id ""
  GOOGLE_CLIENT_SECRET: &google-secret ""
  # Optional: without TorBox, Mint uses Cobalt for every download.
  TORBOX_API_KEY: &torbox-key ""

x-app: &app
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-data: &needs-data
  init:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  init:
    <<: *app
    image: ghcr.io/chickenbone/mint-worker:latest
    restart: "no"
    user: "0:0"
    entrypoint: ["node", "init.mjs"]
    command: []
    environment:
      MINT_DOMAIN: *domain
      ADMIN_EMAIL: *admin-email
    network_mode: none
    volumes:
      - secrets:/secrets
      - music:/music
      - blackhole:/blackhole

  caddy:
    <<: *app
    image: caddy:2
    environment:
      MINT_DOMAIN: *domain
      CADDY_SCHEME: *caddy-scheme
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        cat > /etc/caddy/Caddyfile <<'CADDY'
        {
          admin off
        }
        {$$CADDY_SCHEME}://{$$MINT_DOMAIN} {
          encode zstd gzip
          handle /ws* {
            reverse_proxy realtime:3001 {
              header_up X-Forwarded-For {remote_host}
            }
          }
          handle /ingest/* {
            request_body {
              max_size 250MB
            }
            reverse_proxy hub:8090 {
              header_up X-Forwarded-For {remote_host}
              transport http {
                read_timeout 1h
                write_timeout 1h
              }
            }
          }
          handle {
            reverse_proxy web:3000 {
              header_up X-Forwarded-For {remote_host}
              header_up X-Real-IP {remote_host}
            }
          }
        }
        CADDY
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
      hub:
        condition: service_healthy

  web:
    <<: *app
    image: ghcr.io/chickenbone/mint-web:latest
    environment:
      MINT_DOMAIN: *domain
      GOOGLE_CLIENT_ID: *google-id
      GOOGLE_CLIENT_SECRET: *google-secret
    volumes: [secrets:/secrets:ro]
    networks: [edge, data]
    depends_on: *needs-data

  realtime:
    <<: *app
    image: ghcr.io/chickenbone/mint-realtime:latest
    environment:
      MINT_DOMAIN: *domain
    volumes: [secrets:/secrets:ro]
    networks: [edge, data]
    depends_on: *needs-data

  hub:
    <<: *app
    image: ghcr.io/chickenbone/mint-worker:latest
    command: ["node", "--enable-source-maps", "dist/hub.js"]
    environment:
      MINT_DOMAIN: *domain
      HUB_PORT: "8090"
      STAGING_DIR: /data/staging
    volumes:
      - secrets:/secrets:ro
      - staging:/data/staging
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [edge, data]
    depends_on:
      worker:
        condition: service_started

  worker:
    <<: *app
    image: ghcr.io/chickenbone/mint-worker:latest
    environment:
      MINT_DOMAIN: *domain
      ADMIN_EMAIL: *admin-email
      GOOGLE_CLIENT_ID: *google-id
      GOOGLE_CLIENT_SECRET: *google-secret
      TORBOX_API_KEY: *torbox-key
      MUSIC_DIR: /music
      STAGING_DIR: /data/staging
      BLACKHOLE_TORRENT_DIR: /blackhole/torrents
      BLACKHOLE_DOWNLOAD_DIR: /blackhole/downloads
      LIDARR_URL: http://lidarr:8686
      LIDARR_CONFIG_DIR: /lidarr-config
      COBALT_URL: http://cobalt:9000
      PLEX_URL: http://plex:32400
      PLEX_CONFIG_DIR: /plex-config
    volumes:
      - secrets:/secrets:ro
      - music:/music
      - blackhole:/blackhole
      - staging:/data/staging
      - plex_config:/plex-config:ro
      - lidarr_config:/lidarr-config:ro
    networks: [data, media]
    depends_on: *needs-data

  postgres:
    <<: *app
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mint
      POSTGRES_DB: mint
      POSTGRES_PASSWORD_FILE: /secrets/postgres_password
    volumes:
      - postgres:/var/lib/postgresql/data
      - secrets:/secrets:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mint -d mint"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      init:
        condition: service_completed_successfully

  redis:
    <<: *app
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis:/data]
    networks: [data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  lidarr:
    <<: *app
    image: lscr.io/linuxserver/lidarr:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
    volumes:
      - lidarr_config:/config
      - music:/music
      - blackhole:/blackhole
    # Not exposed to the internet. See README for adding indexers from a NAS.
    ports: ["127.0.0.1:8686:8686"]
    networks: [media]
    depends_on:
      init:
        condition: service_completed_successfully

  cobalt:
    <<: *app
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    environment:
      API_URL: http://cobalt:9000/
      API_PORT: "9000"
    networks: [media]

  plex:
    <<: *app
    image: lscr.io/linuxserver/plex:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Etc/UTC
      VERSION: docker
      PLEX_CLAIM: *plex-claim
    volumes:
      - plex_config:/config
      - music:/music:ro
    ports: ["32400:32400"]
    networks: [media]
    depends_on:
      init:
        condition: service_completed_successfully

networks:
  edge: {}
  data: {}
  media: {}

volumes:
  secrets: {}
  music: {}
  blackhole: {}
  caddy_data: {}
  caddy_config: {}
  postgres: {}
  redis: {}
  staging: {}
  lidarr_config: {}
  plex_config: {}
