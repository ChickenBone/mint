# Local development: just Postgres and Redis on localhost. Run the apps with `npm run dev:*`.
name: mint-dev

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: mint, POSTGRES_PASSWORD: mint, POSTGRES_DB: mint }
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]

volumes:
  pg: {}
