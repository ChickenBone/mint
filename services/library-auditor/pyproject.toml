[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "mint-library-auditor"
version = "0.1.0"
description = "Standalone read-only music library metadata quality audits"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "pydantic>=2.10,<3",
  "httpx==0.28.1",
  "uvicorn==0.34.2",
]

[project.optional-dependencies]
test = ["pytest==8.3.5", "ruff==0.11.10"]

[project.scripts]
mint-library-auditor = "auditor.main:main"

[tool.setuptools]
packages = ["auditor"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
