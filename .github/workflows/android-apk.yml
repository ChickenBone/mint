name: Android EAS Build and Update

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/client/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - ".npmrc"
      - "react-native.config.js"
      - "patches/**"
      - "deploy/mobile/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Build a new APK even if the native runtime is unchanged
        type: boolean
        default: false

concurrency:
  group: android-distribution-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: "1"
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  ANDROID_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

jobs:
  distribute:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: build-tools;36.0.0
      - name: Require Expo authentication
        run: test -n "$EXPO_TOKEN" || { echo '::error::Configure the EXPO_TOKEN GitHub Actions secret.'; exit 1; }
      - run: npm ci --no-audit --no-fund
      - run: npm install --global eas-cli@27.5.0 --no-audit --no-fund
      - run: node --test deploy/mobile/eas-distribution.test.mjs
      - name: Apply the guarded audio patch before calculating the native fingerprint
        run: node deploy/mobile/eas-distribution.mjs patch-audio
      - name: Link and validate Expo project
        run: |
          mkdir -p .android-ci
          node deploy/mobile/eas-distribution.mjs prepare-link
          (cd apps/mobile && eas init --id 5a1e1df0-825c-4b34-8f29-21747fb78b97 --force --non-interactive --no-icon --json > ../../.android-ci/link.json)
          node deploy/mobile/eas-distribution.mjs validate-link
      - name: Prepare ignored local EAS credentials and verify certificate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p .android-ci
          git check-ignore -q apps/mobile/credentials.json
          node deploy/mobile/eas-distribution.mjs credentials
      - name: Resolve production runtime with Expo Updates
        working-directory: apps/mobile
        run: |
          eas env:exec production 'EXPO_NO_DOTENV=1 node ../../node_modules/expo-updates/bin/cli.js runtimeversion:resolve --platform android --workflow managed > ../../.android-ci/runtime.json' --non-interactive
      - name: Find a finished production build for this exact runtime
        working-directory: apps/mobile
        run: |
          runtime=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("../../.android-ci/runtime.json")).runtimeVersion)')
          eas build:list --platform android --status finished --distribution internal --channel production --build-profile production --runtime-version "$runtime" --limit 50 --json --non-interactive > ../../.android-ci/builds.json
      - name: Check native compatibility and artifact availability
        id: gate
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || false }}
        run: |
          node deploy/mobile/eas-distribution.mjs gate
          if [ "$(cat .android-ci/baseline.json)" = null ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            url=$(node deploy/mobile/eas-distribution.mjs artifact-url)
            if curl --fail --location --silent --show-error --retry 2 "$url" -o .android-ci/mint.apk; then
              node deploy/mobile/eas-distribution.mjs verify-apk
              echo 'build=false' >> "$GITHUB_OUTPUT"
            else
              echo 'EAS artifact unavailable; rebuilding conservatively.'
              echo 'build=true' >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Build signed production APK on EAS
        if: steps.gate.outputs.build == 'true'
        run: |
          (cd apps/mobile && eas build --platform android --profile production --wait --freeze-credentials --json --non-interactive > ../../.android-ci/build-result.json)
          node deploy/mobile/eas-distribution.mjs build-result
          url=$(node deploy/mobile/eas-distribution.mjs artifact-url)
          curl --fail --location --silent --show-error --retry 2 "$url" -o .android-ci/mint.apk
          node deploy/mobile/eas-distribution.mjs verify-apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.build == 'true'
        with:
          name: mint-android-apk
          path: .android-ci/mint.apk
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Publish compatible JavaScript update on EAS
        if: steps.gate.outputs.build == 'false'
        working-directory: apps/mobile
        run: |
          eas env:exec production 'EXPO_NO_DOTENV=1 node ../../node_modules/expo-updates/bin/cli.js runtimeversion:resolve --platform android --workflow managed > ../../.android-ci/update-runtime.json' --non-interactive
          node -e 'const fs=require("fs"); const a=JSON.parse(fs.readFileSync("../../.android-ci/runtime.json")); const b=JSON.parse(fs.readFileSync("../../.android-ci/update-runtime.json")); if (!a.runtimeVersion || a.runtimeVersion!==b.runtimeVersion) throw Error("Runtime changed; refusing publication")'
          eas update --platform android --channel production --environment production --message "GitHub ${GITHUB_SHA}" --non-interactive
      - name: Delivery summary
        env:
          BUILT: ${{ steps.gate.outputs.build }}
        run: |
          if [ "$BUILT" = true ]; then
            echo 'A signed APK was built on EAS, verified against the configured certificate, and uploaded as an Actions artifact. Install it to receive this native runtime. No OTA was published in this run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The matching finished EAS APK and its signer were verified; a production Android update was published. Updates are downloaded on launch and applied on a subsequent launch; embedded recovery remains available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove local signing credentials
        if: always()
        run: |
          rm -f apps/mobile/credentials.json .android-ci/release.keystore
          if [ -f .android-ci/app-config-before-init.json ]; then
            cp .android-ci/app-config-before-init.json apps/mobile/app.json
          fi
