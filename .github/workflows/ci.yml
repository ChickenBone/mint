name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mint_library_test
          POSTGRES_USER: mint
          POSTGRES_PASSWORD: fixture-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mint -d mint_library_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - name: Install audio integration test tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm test
        env:
          MINT_LIBRARY_TEST_DATABASE_URL: postgres://mint:fixture-only@localhost:5432/mint_library_test
          MINT_LIBRARY_TEST_REDIS_URL: redis://localhost:6379/0
          MINT_TORBOX_TEST_REDIS_URL: redis://localhost:6379/14
          MINT_AUDIO_TEST: "true"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - name: Validate deployment files
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.nas.yml config --quiet
          docker compose -f docker-compose.nas-migrate.yml config --quiet
          MINT_DOMAIN=mint.example.com docker compose -f docker-compose.yml -f docker-compose.vercel.yml config --quiet
          node --test deploy/docker/compose.test.mjs
          docker create --name mint-caddy-test-binary caddy:2
          docker cp mint-caddy-test-binary:/usr/bin/caddy /tmp/mint-caddy
          docker rm mint-caddy-test-binary
          CADDY_BINARY=/tmp/mint-caddy node --test deploy/docker/caddy.test.mjs

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Scan Git history without disclosing matches
        run: |
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location --retry 3 -O https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner --log-opts="--all"
